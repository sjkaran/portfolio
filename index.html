<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shubhrajit Karan — The Gallery of Code</title>
  <meta name="description" content="Shubhrajit Karan — Python / AI-ML developer. A gallery of masterpieces re-painted in code." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500;1,700&family=JetBrains+Mono:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="wall-light" aria-hidden="true"></div>

  <header id="topbar">
    <a href="#hero" class="brand">S<span>.</span>J<span>.</span>K</a>
    <nav class="topnav" aria-label="Sections">
      <a href="#gallery">Gallery</a>
      <a href="#gallery" data-jump="contact">Contact</a>
    </nav>
  </header>

  <!-- HERO — The Creation of Adam, re-rendered in code glyphs -->
  <section id="hero">
    <canvas id="hero-canvas" aria-label="The Creation of Adam redrawn in code characters: two hands reaching, a spark of light between them, a laptop on Adam's lap" role="img"></canvas>
    <div class="hero-copy">
      <p class="hero-after">after Michelangelo, 1512 &nbsp;·&nbsp; digitised 2026</p>
      <h1 class="hero-name" id="hero-name"></h1>
      <p class="hero-role"><span id="typewriter"></span><span class="cursor" aria-hidden="true">▌</span></p>
      <p class="hero-bio" id="hero-bio"></p>
      <div class="hero-cta">
        <a href="#gallery" class="btn btn-gold">Enter the gallery</a>
        <a href="#gallery" data-jump="contact" class="btn btn-ghost">Commission a work</a>
      </div>
    </div>
  </section>

  <!-- GALLERY — Pinterest-style masonry -->
  <main id="gallery">
    <div class="filters" id="filters" role="toolbar" aria-label="Filter the gallery">
      <button class="chip active" data-filter="all">All works</button>
      <button class="chip" data-filter="projects">Projects</button>
      <button class="chip" data-filter="skills">Skills</button>
      <button class="chip" data-filter="about">About</button>
      <button class="chip" data-filter="contact">Contact</button>
    </div>
    <div class="masonry" id="masonry"></div>
  </main>

  <footer id="footer">
    <p class="footer-title">The Gallery of Code</p>
    <p id="footer-text"></p>
    <p class="footer-fine">Paintings after public-domain masters, re-drawn procedurally in canvas. No images were harmed.</p>
  </footer>

  <!-- VIEWER — click any work to enter it -->
  <dialog id="viewer" aria-label="Work details">
    <button class="viewer-close" id="viewer-close" aria-label="Close">×</button>
    <div class="viewer-grid">
      <div class="viewer-art frame frame-gilt"><canvas id="viewer-canvas"></canvas></div>
      <div class="viewer-info" id="viewer-info"></div>
    </div>
  </dialog>

  <script src="paintings.js"></script>
  <script src="script.js"></script>
</body>
</html>
